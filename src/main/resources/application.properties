spring.application.name=activity-generator

#Включаем и настраеваем встроенную базу данных H2
spring.datasource.url=jdbc:h2:mem:activitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#Настройка Hibernate для автоматического создания таблиц из наших @Entity классов
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

#Включаем веб-консоль H2, чтобы смотреть таблицы в браузере
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Показывать SQL-запросы в консоли
spring.jpa.show-sql=true
